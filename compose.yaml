name: biblioteca-evaluacion-2
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Ejecuta scripts/iniciar-sql-mac.sh}
    ports:
      - "${BIBLIOTECA_BIND_IP:?Define la IP privada del Mac}:14333:1433"
    volumes:
      - biblioteca_sql:/var/opt/mssql
      - ./sql:/workspace/sql:ro
    restart: "no"
volumes:
  biblioteca_sql:
